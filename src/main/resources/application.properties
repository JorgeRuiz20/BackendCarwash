# ===============================================
# CARWASH SOLUTIONS - APPLICATION PROPERTIES
# ===============================================

# SERVER
server.port=${PORT:8080}
spring.application.name=carwash-backend

# DATABASE - MYSQL AIVEN CLOUD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-b522389-elmaincr092-e7b7.d.aivencloud.com:25406/defaultdb?sslMode=REQUIRED&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HIKARI
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# SQL INIT
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/views.sql

# JWT
jwt.secret=${JWT_SECRET:mySecretKeyForCarwashApplicationThatNeedsToBeAtLeast256BitsLongAndSecure2024!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed.origins=${CORS_ORIGINS:https://frontendcarwash.onrender.com,http://localhost:5173,http://localhost:3000}

# LOGGING
logging.level.root=INFO
logging.level.com.carwash=INFO
logging.level.org.springframework.security=WARN

# SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JACKSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima
spring.jackson.serialization.fail-on-empty-beans=false

# FILE UPLOAD
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# SCHEDULING
spring.task.scheduling.pool.size=5
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10

# TRANSACTION
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
